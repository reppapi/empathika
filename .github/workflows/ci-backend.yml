name: CI Backend

on:
  push:
    paths:
      - 'backend/**'
      - 'packages/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'packages/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: empathika_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter backend prisma:generate
      - run: pnpm --filter backend lint
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter backend prisma:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/empathika_test
      - run: pnpm --filter backend exec prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/empathika_test
      - run: pnpm --filter backend prisma:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/empathika_test
      - run: pnpm --filter backend test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/empathika_test
          JWT_SECRET: test-secret-key-minimum-32-characters-long
          NODE_ENV: test

