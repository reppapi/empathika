name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    if: contains(github.event.commits.*.modified, 'frontend/')
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: echo 'Deploy FE via Vercel CLI atau integrasi Vercel GitHub App'

  deploy-backend:
    runs-on: ubuntu-latest
    if: contains(github.event.commits.*.modified, 'backend/')
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Backend
        run: echo 'Deploy BE ke Railway/Render/VPS'

